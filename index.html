  function loadChapters() {
    const sub = document.getElementById('subjectSelect').value;
    const chSelect = document.getElementById('chapterSelect');
    chSelect.innerHTML = '<option value="">-- অধ্যায় সিলেক্ট করুন --</option>';

    if (sub && studyData[sub]) {
      const chapters = studyData[sub].chapters;
      for (let key in chapters) {
        let option = document.createElement('option');
        option.value = key;
        option.innerText = chapters[key].title;
        chSelect.appendChild(option);
      }
    }
  }

  function showChapterContent() {
    const sub = document.getElementById('subjectSelect').value;
    const chKey = document.getElementById('chapterSelect').value;
    const display = document.getElementById('displayArea');

    if (!sub || !chKey) return;

    const data = studyData[sub].chapters[chKey];
    
    let htmlContent = `
      <div class="card">
        <h3>📖 ${data.title}</h3>
        <p><b>মূল বিষয়বস্তু:</b> ${data.summary}</p>
      </div>

      <div class="card">
        <h3>📐 গুরুত্বপূর্ণ সূত্র ও সংজ্ঞাসমূহ</h3>
        <ul>
          ${data.formulas.map(f => `<li>${f}</li>`).join('')}
        </ul>
      </div>

      <div class="card">
        <h3>❓ অতি গুরুত্বপূর্ণ সংক্ষিপ্ত প্রশ্ন ও উত্তর</h3>
        ${data.shortQ.map((q, index) => `<p><b>${index + 1}. প্রশ্ন: ${q.q}</b><br>উত্তর: ${q.a}</p><hr style="margin:8px 0; border:0; border-top:1px dashed #ccc;">`).join('')}
      </div>

      <div class="card">
        <h3>🎯 পরীক্ষায় আসার মতো সেরা সৃজনশীল প্রশ্ন (CQ)</h3>
        ${data.cqs.map((cq, i) => `
          <div class="cq-box">
            <div class="cq-title">সৃজনশীল প্রশ্ন ${i+1}:</div>
            <p style="white-space: pre-line;">${cq.q}</p>
          </div>
        `).join('')}
      </div>
    `;

    display.innerHTML = htmlContent;
  }

  function sendQuickMessage() {
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if (!msg) return;

    const display = document.getElementById('displayArea');

    let userDiv = document.createElement('div');
    userDiv.className = "chat-msg user-msg";
    userDiv.innerText = msg;
    display.appendChild(userDiv);

    input.value = '';

    let botReply = "ধন্যবাদ! ওপরের ড্রপডাউন থেকে নির্দিষ্ট বিষয় ও অধ্যায় সিলেক্ট করে পড়াশোনা চালিয়ে যান।";
    const lowerMsg = msg.toLowerCase();

    if (lowerMsg.includes("কেমন আছ") || lowerMsg.includes("কেমন আছেন")) {
      botReply = "আমি আলহামদুলিল্লাহ ভালো আছি! আপনার পড়াশোনার প্রস্তুতি কেমন চলছে?";
    } else if (lowerMsg.includes("হ্যালো") || lowerMsg.includes("হাই") || lowerMsg.includes("hello") || lowerMsg.includes("hi")) {
      botReply = "হ্যালো! আপনার স্টাডি হাবে আপনাকে স্বাগতম।";
    }

    setTimeout(() => {
      let botDiv = document.createElement('div');
      botDiv.className = "chat-msg bot-msg";
      botDiv.innerText = botReply;
      display.appendChild(botDiv);
      display.scrollTop = display.scrollHeight;
    }, 400);

    display.scrollTop = display.scrollHeight;
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendQuickMessage();
  }
</script>
</body>
</html>

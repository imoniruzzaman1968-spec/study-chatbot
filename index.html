
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্কুল স্টাডি গাইড চ্যাটবট - পাঠশালা</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            height: 92vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #0ba360, #3cba92);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header i {
            font-size: 30px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 50%;
        }

        .chat-header div h2 {
            font-size: 18px;
        }

        .chat-header div p {
            font-size: 12px;
            opacity: 0.9;
        }

        .subject-tags {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background-color: #f1f3f6;
            overflow-x: auto;
            border-bottom: 1px solid #e0e0e0;
        }

        .subject-tags::-webkit-scrollbar {
            height: 4px;
        }

        .subject-tags::-webkit-scrollbar-thumb {
            background: #3cba92;
            border-radius: 4px;
        }

        .tag {
            background: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #0ba360;
            border: 1px solid #0ba360;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.3s;
        }

        .tag:hover {
            background: #0ba360;
            color: white;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f9f9fb;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: #e2f8ec;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .user-message {
            background: linear-gradient(135deg, #0ba360, #3cba92);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .input-container {
            display: flex;
            padding: 12px;
            background-color: white;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        .input-container input:focus {
            border-color: #0ba360;
        }

        .input-container button {
            background: linear-gradient(135deg, #0ba360, #3cba92);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: 0.2s;
        }

        .input-container button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <i class="fas fa-book-reader"></i>
            <div>
                <h2>স্কুল স্টাডি গাইড চ্যাটবট 📘</h2>
                <p>সকল বিষয়ের গাইড বুক ও সমাধান!</p>
            </div>
        </div>

        <!-- Subject Guide Tags -->
        <div class="subject-tags">
            <span class="tag" onclick="quickAsk('পদার্থবিজ্ঞান')">⚡ পদার্থবিজ্ঞান</span>
            <span class="tag" onclick="quickAsk('রসায়ন')">🧪 রসায়ন</span>
            <span class="tag" onclick="quickAsk('জীববিজ্ঞান')">🧬 জীববিজ্ঞান</span>
            <span class="tag" onclick="quickAsk('উচ্চতর গণিত')">📐 উচ্চতর গণিত</span>
            <span class="tag" onclick="quickAsk('জেনারেল ম্যাথ')">📊 জেনারেল ম্যাথ</span>
            <span class="tag" onclick="quickAsk('জেনারেল সাইন্স')">💡 জেনারেল সাইন্স</span>
            <span class="tag" onclick="quickAsk('ইংরেজি')">🇬🇧 ইংরেজি</span>
            <span class="tag" onclick="quickAsk('বা.ও.বি')">🇧🇩 বা.ও.বি</span>
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                স্বাগতম! 👋 আমি তোমার স্কুল গাইড সহকারী। ওপরে দেওয়া সাবজেক্ট ট্যাগে ক্লিক করে অথবা লিখে যেকোনো বিষয়ের গাইড নোট ও সমাধান জেনে নিতে পারো!
            </div>
        </div>

        <!-- Input Box -->
        <div class="input-container">
            <input type="text" id="userInput" placeholder="কোন বিষয়ের গাইড বা সমাধান চাও এখানে লেখো..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            
            if (messageText === '') return;

            // User Message Add
            appendMessage(messageText, 'user-message');
            input.value = '';

            // Bot Response based on Guide Books
            setTimeout(() => {
                let botReply = getGuideBookResponse(messageText);
                appendMessage(botReply, 'bot-message');
            }, 600);
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function quickAsk(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function getGuideBookResponse(input) {
            input = input.toLowerCase();

            if (input.includes('পদার্থবিজ্ঞান') || input.includes('physics')) {
                return "⚡ [পদার্থবিজ্ঞান গাইড]:\n• গতি, বল, কাজ, শক্তি ও ক্ষমতা অধ্যায়ের গুরুত্বপূর্ণ সূত্র:\n1. বেগ (v) = s / t\n2. ত্বরণ (a) = (v - u) / t\n3. বল (F) = m × a\n4. গতিশক্তি = 1/2 mv²\n\nগাইড বইয়ের যেকোনো নির্দিষ্ট টপিক বা প্রশ্ন জানতে চাইলে এখানে লিখে জানাও!";
            } 
            else if (input.includes('রসায়ন') || input.includes('chemistry')) {
                return "🧪 [রসায়ন গাইড]:\n• গুরুত্বপূর্ণ তথ্য:\n1. পানির সংকেত: H₂O\n2. সাধারণ লবণের সংকেত: NaCl\n3. পর্যায় সারণিতে হাইড্রোজেন প্রথম মৌল।\n\nমৌল, বিক্রিয়া বা অন্য কোনো অধ্যায়ের গাইড নোট লাগবে কি?";
            } 
            else if (input.includes('জীববিজ্ঞান') || input.includes('biology')) {
                return "🧬 [জীববিজ্ঞান গাইড]:\n• কোষ হলো জীবের গঠন ও কাজের একক।\n• উদ্ভিদ কোষে কোষপ্রাচীর থাকে কিন্তু প্রাণী কোষে থাকে না।\n• মাইটোকন্ড্রিয়াকে কোষের পাওয়ার হাউস বা শক্তি উৎপাদক বলা হয়।\n\nকোন অধ্যায় বা প্রশ্ন দেখতে চাও বলো?";
            } 
            else if (input.includes('উচ্চতর গণিত') || input.includes('higher math')) {
                return "📐 [উচ্চতর গণিত গাইড]:\n• ত্রিকোণমিতি, বীজগণিতীয় রাশিমালা এবং জ্যামিতির উপপাদ্য আমাদের গাইড বইতে রয়েছে। যেমন: (a + b)² সূত্র বা পিথাগোরাসের উপপাদ্য ($a^2 + b^2 = c^2$)।\n\nকোন অংকটি সমাধান করে দিতে হবে লিখে পাঠাও!";
            } 
            else if (input.includes('জেনারেল ম্যাথ') || input.includes('general math') || input.includes('গণিত')) {
                return "📊 [জেনারেল ম্যাথ গাইড]:\n• পাটিগণিত (মুনাফা, শতকরা, অনুপাত), বীজগণিত ও পরিমিতির সহজ সমাধান এখানে পাওয়া যায়।\n\nতোমার গণিত সমস্যাটি এখানে লিখে দাও, গাইড বইয়ের নিয়মে সমাধান বুঝিয়ে দেবো!";
            } 
            else if (input.includes('জেনারেল সাইন্স') || input.includes('general science') || input.includes('বিজ্ঞান')) {
                return "💡 [জেনারেল সাইন্স গাইড]:\n• আমাদের পরিবেশ, খাদ্য ও পুষ্টি, এবং রোগব্যাধি সম্পর্কিত মৌলিক প্রশ্ন ও উত্তর।\n\nবিজ্ঞান বিষয়ের কোনো নির্দিষ্ট প্রশ্ন থাকলে সরাসরি জিজ্ঞেস করো!";
            } 
            else if (input.includes('ইংরেজি') || input.includes('english')) {
                return "🇬🇧 [ইংরেজি গাইড]:\n• Grammar এর গুরুত্বপূর্ণ নিয়ম:\n1. Tense তিন প্রকার (Present, Past, Future) এবং প্রতিটির ৪টি করে রূপ রয়েছে।\n2. Subject যদি Singular Number হয়, তবে Verb-এর সাথে s/es যুক্ত হয় (Present Indefinite Tense-এ)।\n\n어떤 Translation বা Grammar শিখতে চাও?";
            } 
            else if (input.includes('বা.ও.বি') || input.includes('বাংলাদেশ ও বিশ্বপরিচয়')) {
                return "🇧🇩 [বাংলাদেশ ও বিশ্বপরিচয় গাইড]:\n• ১৯৭১ সালের মহান মুক্তিযুদ্ধ, আমাদের সংবিধান, ইতিহাস ও ভূগোলের গুরুত্বপূর্ণ প্রশ্নসমূহ এই গাইডের অন্তর্ভুক্ত।\n\nকোন সালের ইতিহাস বা অধ্যায় জানতে চাও বলো?";
            } 
            else if (input.includes('হ্যালো') || input.includes('হাই')) {
                return "হ্যালো! কেমন আছো? ওপরে দেওয়া বিষয়গুলো থেকে আজ কোন বিষয়ের গাইড পড়তে চাও বলো?";
            } 
            else {
                return "বই বা গাইডে এই বিষয়ে বিস্তারিত নোট তৈরি করা আছে। তুমি যে প্রশ্নটি করেছো, সেটির ওপর খুব শীঘ্রই গাইড বইয়ের সম্পূর্ণ সমাধান এবং অটোমেটিক ব্যাখ্যা যুক্ত করা হবে। তুমি অন্য কোনো বিষয় বা প্রশ্ন দেখতে পারো!";
            }
        }
    </script>

</body>
</html>
